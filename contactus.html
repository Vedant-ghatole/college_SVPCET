    <link rel="stylesheet" href="college.css">

<body>
    <header>
        <div class="logo-container">
            <img src="img/SVPCET logo.jpg" alt="SVPCET Logo">
            <h1>St. Vincent Pallotti College of Engineering & Technology, Nagpur</h1>
        </div>
 
        <div class="contact-info">
            <a href="mailto:info@stvincentngp.edu.in" aria-label="Email SVPCET">
                <i class="flaticon-email mr-1"></i> info@stvincentngp.edu.in
            </a>
            <a href="https://www.facebook.com/stvincentngp/" target="_blank" rel="noopener" aria-label="Facebook">
                <i class="fab fa-facebook"></i>
            </a>
            <a href="https://www.instagram.com/svpcetnagpur" target="_blank" rel="noopener" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://twitter.com/techpallottines" target="_blank" rel="noopener" aria-label="Twitter">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="https://www.youtube.com/channel/UCwI-u4lNseB2N9t2H5otnVA" target="_blank" rel="noopener" aria-label="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="https://www.linkedin.com/school/svpcet/?viewAsMember=true" target="_blank" rel="noopener" aria-label="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
        </div>
 
        <nav class="navbar">
            <ul>
                <li><a href="index.html" class="btn">Home</a></li>
                <li><a href="login.html" class="btn" aria-label="ERP Home">ERP (Home)</a></li>

                <li><a href="contactus.html" class="btn">Contact Us</a></li>

            </ul>
        </nav>
    </header>    
    
    <marquee class="marquee" behavior="scroll" direction="left" scrollamount="20"> 
        <span style="font-size: 2em; font-weight: bold;">!! Welcome to SVPCET !!</span>
    </marquee>

    <section class="form-container">
        <h2>Contact Us</h2>
        <form>
            <div>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                <div id="nameError" class="error-message"></div>
            </div>
    
            <div>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <div id="emailError" class="error-message"></div>
            </div>
    
            <div>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                <div id="phoneError" class="error-message"></div>
            </div>
    
            <div>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" placeholder="Enter your message" required></textarea>
                <div id="messageError" class="error-message"></div>
            </div>
    
            <button type="submit" class="button">Submit</button>
        </form>   
    </section>

    <section>
        <h2>Contact Us</h2>
        <img src="img/svpcet3.png" alt="SVPCET Campus location" width="100%" height="20%">
    </section>

    <section>
        <h2>Location</h2>
        <img src="img/svpcet4.png" alt="SVPCET Campus" width="100%" height="20%">
    </section>

    <div class="footer-container">
        <b>Design & Developed By: VEDANT GHATOLE</b>
    </div>
</body>
</html>
