<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weekly Survey - Student Growth</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
  <style>
  body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #e0e7ff 0%, #f4f7fc 100%);
    margin: 0;
    padding: 0;
    line-height: 1.6;
    min-height: 100vh;
  }
  
  .container {
    max-width: 900px;
    margin: 60px auto;
    padding: 0 20px;
  }
  
  .feature-card {
    background-color: #ffffff;
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(74, 144, 226, 0.10), 0 1.5px 6px rgba(0,0,0,0.04);
    padding: 60px 50px 40px 50px;
    animation: fadeIn 0.6s ease-in-out;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .form-header {
    background: linear-gradient(90deg, #4A90E2 60%, #6ec6ff 100%);
    color: white;
    padding: 32px 20px 28px 20px;
    border-radius: 18px 18px 0 0;
    text-align: center;
    margin-bottom: 30px;
    box-shadow: 0 2px 8px rgba(74, 144, 226, 0.08);
  }
  
  .form-header h3 {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  
  .small-text {
    font-size: 18px;
    text-align: center;
    margin-bottom: 40px;
    color: #555;
  }
  
  label {
    font-size: 19px;
    font-weight: 600;
    color: #222;
    display: block;
    margin-bottom: 12px;
    margin-top: 10px;
  }
  
  .form-group {
    margin-bottom: 40px;
  }
  
  .form-control {
    font-size: 17px;
    padding: 18px 18px;
    border-radius: 12px;
    border: 1.5px solid #c7d0e1;
    transition: border-color 0.3s, box-shadow 0.3s;
    background: #f8faff;
    box-shadow: 0 1px 4px rgba(74, 144, 226, 0.04);
    margin-bottom: 6px;
    position: relative;
  }
  
  .form-control:focus {
    border-color: #4A90E2;
    box-shadow: 0 0 12px rgba(74, 144, 226, 0.18);
    background: #f0f7ff;
  }
  
  textarea {
    min-height: 140px;
    resize: vertical;
  }
  
  .btn-primary {
    background: linear-gradient(90deg, #4A90E2 60%, #357ab7 100%);
    border: none;
    padding: 18px;
    font-size: 20px;
    font-weight: 700;
    border-radius: 12px;
    width: 100%;
    transition: background 0.3s, box-shadow 0.3s;
    box-shadow: 0 2px 8px rgba(74, 144, 226, 0.10);
    letter-spacing: 0.5px;
  }
  
  .btn-primary:hover, .btn-primary:focus {
    background: linear-gradient(90deg, #357ab7 60%, #4A90E2 100%);
    box-shadow: 0 4px 16px rgba(74, 144, 226, 0.18);
  }
  
  .form-footer {
    text-align: center;
    font-size: 15px;
    color: #888;
    margin-top: 45px;
  }
  
  .progress-container {
    margin: 20px 0 40px;
    padding: 0 20px;
  }
  
  .progress {
    height: 8px;
    border-radius: 4px;
    background-color: #e0e7ff;
  }
  
  .progress-bar {
    background: linear-gradient(90deg, #4A90E2 60%, #6ec6ff 100%);
    transition: width 0.3s ease;
  }
  
  .char-counter {
    position: absolute;
    right: 10px;
    bottom: 5px;
    font-size: 12px;
    color: #888;
  }
  
  .form-control:focus + .char-counter {
    color: #4A90E2;
  }
  
  .rating-options {
    display: flex;
    gap: 15px;
    margin-top: 10px;
  }
  
  .rating-option {
    padding: 10px 20px;
    border-radius: 8px;
    background: #f0f7ff;
    border: 1px solid #c7d0e1;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .rating-option:hover, .rating-option.selected {
    background: #4A90E2;
    color: white;
    border-color: #4A90E2;
  }
  
  .success-message {
    display: none;
    background: #d4edda;
    color: #155724;
    padding: 20px;
    border-radius: 12px;
    margin: 20px 0;
    text-align: center;
  }
  
  .draft-save {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #6c757d;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .draft-save:hover {
    background: #5a6268;
  }
  
  .date-picker {
    margin-bottom: 20px;
  }
  
  .flatpickr-input {
    width: 100%;
    padding: 18px;
    border-radius: 12px;
    border: 1.5px solid #c7d0e1;
    background: #f8faff;
  }
  
  @media (max-width: 768px) {
    .feature-card {
      padding: 30px 8px 25px 8px;
    }
  
    .form-header h3 {
      font-size: 25px;
    }
  
    label {
      font-size: 17px;
    }
  
    .btn-primary {
      font-size: 17px;
    }
    
    .rating-options {
      flex-direction: column;
      gap: 10px;
    }
    
    .draft-save {
      bottom: 10px;
      right: 10px;
      padding: 8px 16px;
    }
  }
</style>  
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 feature-card">
        <header class="form-header">
          <h3>Weekly Growth Survey</h3>
        </header>
        <p class="small-text">This survey contains 4 questions to help track your growth this week.</p>

        <div class="progress-container">
          <div class="progress">
            <div class="progress-bar" role="progressbar" style="width: 0%"></div>
          </div>
        </div>

        <form class="needs-validation" action="/submit-survey" method="post" novalidate>
          <div class="form-group">
            <label for="surveyDate">Survey Period</label>
            <input type="text" class="flatpickr-input" id="surveyDate" name="surveyDate" placeholder="Select date range" required>
          </div>

          <div class="form-group">
            <label for="q1">1. How do you feel about your progress this week?</label>
            <div class="rating-options">
              <div class="rating-option" data-value="Excellent">Excellent</div>
              <div class="rating-option" data-value="Good">Good</div>
              <div class="rating-option" data-value="Average">Average</div>
              <div class="rating-option" data-value="Poor">Poor</div>
            </div>
            <input type="hidden" id="q1" name="q1" required>
          </div>

          <div class="form-group">
            <label for="q2">2. Did you face any challenges in your learning?</label>
            <textarea class="form-control" id="q2" name="q2" placeholder="Describe any challenges you faced..." required maxlength="500"></textarea>
            <div class="char-counter">0/500</div>
          </div>

          <div class="form-group">
            <label for="q3">3. What area do you feel needs improvement?</label>
            <input type="text" class="form-control" id="q3" name="q3" placeholder="E.g., Time Management, Study Habits" required />
          </div>

          <div class="form-group">
            <label for="q4">4. What strategies will you use to improve next week?</label>
            <textarea class="form-control" id="q4" name="q4" placeholder="Describe your improvement strategies..." required maxlength="500"></textarea>
            <div class="char-counter">0/500</div>
          </div>

          <div class="success-message">
            <i class="fas fa-check-circle"></i> Survey submitted successfully!
          </div>

          <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-secondary" id="saveDraft">Save as Draft</button>
            <button type="submit" class="btn btn-primary">Submit Survey</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- JS for Bootstrap + Validation -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    (function () {
      'use strict';
      
      // Initialize date picker
      flatpickr("#surveyDate", {
        mode: "range",
        dateFormat: "Y-m-d",
        minDate: "today",
        maxDate: new Date().fp_incr(7)
      });

      // Rating selection
      document.querySelectorAll('.rating-option').forEach(option => {
        option.addEventListener('click', function() {
          const parent = this.parentElement;
          parent.querySelectorAll('.rating-option').forEach(opt => opt.classList.remove('selected'));
          this.classList.add('selected');
          const input = parent.nextElementSibling;
          input.value = this.dataset.value;
          updateProgress();
        });
      });

      // Character counter
      document.querySelectorAll('textarea').forEach(textarea => {
        const counter = textarea.nextElementSibling;
        textarea.addEventListener('input', function() {
          counter.textContent = `${this.value.length}/500`;
          updateProgress();
        });
      });

      // Progress bar update
      function updateProgress() {
        const form = document.querySelector('form');
        const inputs = form.querySelectorAll('input[required], textarea[required]');
        const filled = Array.from(inputs).filter(input => input.value.trim() !== '').length;
        const progress = (filled / inputs.length) * 100;
        document.querySelector('.progress-bar').style.width = `${progress}%`;
      }

      // Save draft functionality
      document.getElementById('saveDraft').addEventListener('click', function() {
        const formData = new FormData(document.querySelector('form'));
        localStorage.setItem('surveyDraft', JSON.stringify(Object.fromEntries(formData)));
        alert('Draft saved successfully!');
      });

      // Load draft if exists
      window.addEventListener('load', function() {
        const draft = localStorage.getItem('surveyDraft');
        if (draft) {
          const formData = JSON.parse(draft);
          Object.entries(formData).forEach(([key, value]) => {
            const input = document.querySelector(`[name="${key}"]`);
            if (input) input.value = value;
          });
          updateProgress();
        }
      });

      // Form validation
      window.addEventListener('load', function () {
        const forms = document.getElementsByClassName('needs-validation');
        Array.prototype.forEach.call(forms, function (form) {
          form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
              event.preventDefault();
              event.stopPropagation();
            } else {
              event.preventDefault();
              document.querySelector('.success-message').style.display = 'block';
              localStorage.removeItem('surveyDraft');
              setTimeout(() => {
                window.location.href = "dashboard.html";
              }, 2000);
            }
            form.classList.add('was-validated');
          }, false);
        });
      }, false);
    })();
  </script>
</body>
</html>
