<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>College Administration System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 90%;
      max-width: 1000px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .left-section {
      background: rgba(0, 0, 50, 0.6);
      color: #fff;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .left-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, rgba(0,0,50,0.8), rgba(0,0,50,0.6));
      z-index: -1;
    }

    .left-section img.logo {
      width: 120px;
      margin-bottom: 20px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      transition: transform 0.3s ease;
    }

    .left-section img.logo:hover {
      transform: scale(1.05);
    }

    .left-section h2 {
      font-size: 28px;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .cas {
      margin-top: 20px;
      font-size: 24px;
      border: 2px solid #fff;
      padding: 20px;
      border-radius: 50%;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .cas:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .cas span {
      font-size: 14px;
      margin-top: 5px;
    }

    .right-section {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .form-container {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .form-slider {
      display: flex;
      width: 200%;
      transition: transform 0.5s ease-in-out;
    }

    .form-slider.active {
      transform: translateX(-50%);
    }

    .form-section {
      width: 50%;
      padding: 0 10px;
    }

    .form-title {
      color: #3b0a69;
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: 600;
      text-align: center;
    }

    .form-subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 25px;
      outline: none;
      transition: all 0.3s ease;
      background-color: #f8f9fa;
      font-size: 14px;
    }

    input:focus {
      border-color: #764ba2;
      box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
    }

    .form-group i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
    }

    .captcha-box {
      display: flex;
      align-items: center;
      margin-top: 20px;
      gap: 10px;
    }

    #captchaText {
      font-weight: bold;
      padding: 10px 20px;
      background: #f0f0f0;
      border: 2px dashed #ccc;
      border-radius: 10px;
      font-size: 18px;
      letter-spacing: 2px;
      flex: 1;
    }

    #refreshCaptcha {
      border: none;
      background: #fff;
      color: #764ba2;
      font-size: 20px;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    #refreshCaptcha:hover {
      transform: rotate(180deg);
      box-shadow: 0 0 12px rgba(118, 75, 162, 0.2);
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      gap: 15px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background-color: #6c63ff;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #574b90;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: #fff;
      border: 2px solid #6c63ff;
      color: #6c63ff;
    }

    .btn-secondary:hover {
      background-color: #f0f0f0;
      transform: translateY(-2px);
    }

    .form-footer {
      margin-top: 20px;
      text-align: center;
    }

    .form-footer a {
      color: #764ba2;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s ease;
    }

    .form-footer a:hover {
      color: #574b90;
      text-decoration: underline;
    }

    .form-switch {
      text-align: center;
      margin-top: 20px;
    }

    .form-switch a {
      color: #764ba2;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .form-switch a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }

      .left-section {
        padding: 20px;
      }

      .right-section {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-section">
      <img src="img/SVPCET logo.jpg" alt="College Logo" class="logo" />
      <h2>College Administration System</h2>
      <div class="cas">CAS<br><span>ERP</span></div>
    </div>

    <div class="right-section">
      <div class="form-container">
        <div class="form-slider">
          <!-- Login Form -->
          <div class="form-section">
            <h2 class="form-title">Login</h2>
            <p class="form-subtitle">Welcome back! Please login to your account</p>
            <form id="loginForm">
              <div class="form-group">
                <input type="text" id="userid" placeholder="User ID" required />
                <i class="fas fa-user"></i>
              </div>
              <div class="form-group">
                <input type="password" id="password" placeholder="Password" required />
                <i class="fas fa-lock"></i>
              </div>
              <div class="form-group">
                <input type="text" id="captchaInput" placeholder="Enter Captcha" required />
              </div>

              <div class="captcha-box">
                <span id="captchaText"></span>
                <button type="button" id="refreshCaptcha">⟳</button>
              </div>

              <div class="buttons">
                <button type="submit" class="btn btn-primary">Login</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
              </div>

              <div class="form-footer">
                <a href="#" class="forgot-password">Forgot Password?</a>
              </div>
            </form>
          </div>

          <!-- Create Account Form -->
          <div class="form-section">
            <h2 class="form-title">Create Account</h2>
            <p class="form-subtitle">Join us! Create your account</p>
            <form id="registerForm">
              <div class="form-group">
                <input type="text" id="fullName" placeholder="Full Name" required />
                <i class="fas fa-user"></i>
              </div>
              <div class="form-group">
                <input type="email" id="email" placeholder="Email Address" required />
                <i class="fas fa-envelope"></i>
              </div>
              <div class="form-group">
                <input type="text" id="username" placeholder="Username" required />
                <i class="fas fa-user-circle"></i>
              </div>
              <div class="form-group">
                <input type="password" id="newPassword" placeholder="Password" required />
                <i class="fas fa-lock"></i>
              </div>
              <div class="form-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
                <i class="fas fa-lock"></i>
              </div>

              <div class="buttons">
                <button type="submit" class="btn btn-primary">Create Account</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="form-switch">
        <a href="#" id="switchToRegister">Don't have an account? Register here</a>
      </div>
    </div>
  </div>

  <script>
    function generateCaptcha(length = 6) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      let captcha = "";
      for (let i = 0; i < length; i++) {
        captcha += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return captcha;
    }

    function loadCaptcha() {
      document.getElementById("captchaText").textContent = generateCaptcha();
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadCaptcha();
      const formSlider = document.querySelector('.form-slider');
      const switchLink = document.getElementById('switchToRegister');
      let isLogin = true;

      document.getElementById("refreshCaptcha").addEventListener("click", () => {
        loadCaptcha();
      });

      switchLink.addEventListener('click', (e) => {
        e.preventDefault();
        isLogin = !isLogin;
        formSlider.classList.toggle('active');
        switchLink.textContent = isLogin ? "Don't have an account? Register here" : "Already have an account? Login here";
      });

      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const enteredCaptcha = document.getElementById("captchaInput").value.trim();
        const actualCaptcha = document.getElementById("captchaText").textContent.trim();

        if (enteredCaptcha === actualCaptcha) {
          window.location.href = "ERP home.html";
          this.reset();
          loadCaptcha();
        } else {
          alert("Incorrect captcha. Please try again.");
          document.getElementById("captchaInput").value = "";
          loadCaptcha();
        }
      });

      document.getElementById("registerForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const password = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
          alert("Passwords do not match!");
          return;
        }

        // Here you would typically send the registration data to your server
        alert("Account created successfully! Please login.");
        formSlider.classList.remove('active');
        switchLink.textContent = "Don't have an account? Register here";
        isLogin = true;
        this.reset();
      });
    });
  </script>
</body>
</html>
